version: "3.9"

services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: content
      POSTGRES_PASSWORD: content
      POSTGRES_DB: content_control_tower
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    profiles: ["optional"]
    ports:
      - "6379:6379"

volumes:
  postgres_data:
